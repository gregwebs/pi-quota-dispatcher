name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22 and 24 are the current LTS lines. 23 is EOL.
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      # The suite loads the extension's own `src/`, and `src/config.ts` reads
      # pi's public config helpers (`getAgentDir`, `CONFIG_DIR_NAME`) at run
      # time — the pattern pi's docs and shipped examples use instead of
      # hardcoding `.pi` or `~/.pi/agent`. Those resolve from the dev
      # dependency, so this job installs. The property the old no-install
      # version of this job was protecting still holds and is guarded in the
      # `checks` job: the published package has no runtime dependencies of its
      # own, only an optional peer the host provides.
      - run: npm ci

      - name: Run tests
        run: npm test

  checks:
    name: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Guards the classic packaging bug: a source file that exists in the repo
      # but is missing from package.json "files", so the published tarball
      # ships a manifest pointing at a file that is not there.
      - name: Verify the pi manifest and files list resolve
        run: |
          set -euo pipefail
          npm pack --dry-run --json > /tmp/pack.json
          node -e '
            const fs = require("node:fs");
            const [pack] = JSON.parse(fs.readFileSync("/tmp/pack.json", "utf8"));
            const shipped = new Set(pack.files.map((f) => f.path));
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));

            const missing = [];
            for (const entry of pkg.pi?.extensions ?? []) {
              const rel = entry.replace(/^\.\//, "");
              if (!shipped.has(rel)) missing.push(`pi.extensions entry not shipped: ${rel}`);
            }
            if (!shipped.has("README.md")) missing.push("README.md not shipped");
            if (!shipped.has("LICENSE")) missing.push("LICENSE not shipped");

            if (missing.length) {
              console.error(missing.join("\n"));
              process.exit(1);
            }
            console.log("packaged files:", [...shipped].sort().join(", "));
          '

      # Guards the published package's runtime dependency list: nothing may
      # creep into `dependencies` or `optionalDependencies`, and every declared
      # peer must be optional in `peerDependenciesMeta` (pi is the peer the
      # host provides). The detector is a committed script, not a string buried
      # in this file, so it is reviewable and covered by
      # `test/runtime-deps.test.ts`.
      - name: Verify zero runtime dependencies
        run: node scripts/check-runtime-deps.js
